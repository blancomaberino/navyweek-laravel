# Gitleaks configuration for the NavyWeek Laravel platform.
#
# Extends the full default ruleset. The ONLY allowlisted paths are the machine-
# generated Stage-A seed-data JSON artifacts (database/seed-data/*.json). Those are
# column dumps of PUBLIC brand data — brand name, slug, category, and a `key` field
# that is literally the brand slug (e.g. "key": "ar15discounts"). Gitleaks'
# generic-api-key heuristic false-positives on the field named "key". These files
# are exporter output derived from public discount data and never contain secrets.
#
# Everything else — all application code AND the markdown research briefs under
# database/seed-data/research-briefs/ — is still fully scanned.
#
# The `regexes` allowlist covers the site's PUBLIC, client-side analytics keys.
# These are shipped in every page's HTML by design (PostHog project key, Ahrefs
# analytics key) — identical to the live legacy site — so they are not secrets;
# gitleaks' generic-api-key heuristic flags them on entropy alone.
title = "NavyWeek platform gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generated seed-data JSON dumps (public brand data) + the public client-side analytics keys"
paths = [
  '''database/seed-data/[a-z0-9-]+\.json''',
]
regexes = [
  '''phc_[A-Za-z0-9]{40,}''',       # PostHog project API key — public, client-side (in the browser bundle)
  '''cyBzsvylryte/RFYYCOQMg''',      # Ahrefs Analytics key — public, embedded in <head>
]
